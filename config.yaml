app:
  name: "IntelliBank AI"
  version: "1.0.0"
  debug: true

llm:
  model: "gpt-4o-mini"
  temperature: 0
  max_tokens: 2000

auth:
  default_username: "admin@intellibank.com"
  password_hash: ""  # Set via env or generate on first run
  session_timeout_minutes: 60

paths:
  data_dir: "data"
  models_dir: "models"
  reports_dir: "reports"
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"

ml:
  fraud_threshold: 0.4
  random_forest:
    n_estimators: 200
    max_depth: 15
    min_samples_split: 5
    min_samples_leaf: 2
    random_state: 42
    n_jobs: -1
  xgboost:
    n_estimators: 200
    max_depth: 8
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
  logistic_regression:
    max_iter: 1000
    random_state: 42
    class_weight: "balanced"
  train_test_split:
    test_size: 0.2
    random_state: 42
    stratify: true

loan:
  max_dti_ratio: 0.4
  interest_rate_annual: 0.12
  loan_term_months: 60
  min_credit_score_prime: 700
  min_credit_score_subprime: 600

fraud_rules:
  large_withdrawal_threshold: -1000
  large_withdrawal_score: 0.4
  unknown_merchant_score: 0.3
  high_risk_countries: ["Unknown", "International"]

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/intellibank.log"